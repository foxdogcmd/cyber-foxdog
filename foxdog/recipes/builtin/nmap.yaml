name: nmap_scan
command: nmap
short_description: 端口/服务扫描（nmap）
description: |
  nmap 端口与服务识别扫描。默认 -sV -sC（版本探测 + 默认脚本）。
  示例：target=10.10.10.5；全网段 target=10.10.10.0/24。
  全端口：flags="-p- -sV --min-rate 5000"；UDP：flags="-sU --top-ports 100"。
  注意：CTF 靶机一般单 IP，先快扫再对开放端口细扫；别对全网段 -p-。
parameters:
  - name: target
    type: string
    required: true
    mapping: positional
    help: 目标 IP / 域名 / 网段
  - name: flags
    type: string
    default: "-sV -sC"
    mapping: combined
    help: nmap 选项串（按 shell 分词）
additional_args: true
timeout: 300
